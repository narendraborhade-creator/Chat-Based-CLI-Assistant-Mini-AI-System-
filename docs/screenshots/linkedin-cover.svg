  <text x="220" y="444" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="22">Mini CLI Assistant - Unique Edition</text>

  <text x="130" y="520" fill="#22d3ee" font-family="Consolas, Menlo, monospace" font-size="26">You&gt; help</text>
  <text x="130" y="565" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="21">time, date, help, calc, joke, note, notes, history, insights</text>
  <text x="130" y="600" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="21">mode, challenge, alias, aliases, profile, exit</text>

