  <rect x="88" y="920" width="286" height="184" rx="22" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.35"/>
  <rect x="396" y="920" width="286" height="184" rx="22" fill="#0f3d2e" stroke="#22c55e" stroke-opacity="0.35"/>
  <rect x="704" y="920" width="286" height="184" rx="22" fill="#3f2b13" stroke="#f59e0b" stroke-opacity="0.35"/>

