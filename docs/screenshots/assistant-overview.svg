<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="CLI assistant overview screenshot">
  <rect width="1280" height="900" fill="#08111f"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="56" y="52" width="1168" height="796" rx="20" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <circle cx="102" cy="90" r="9" fill="#fb7185"/>
  <circle cx="131" cy="90" r="9" fill="#f59e0b"/>
  <circle cx="160" cy="90" r="9" fill="#22c55e"/>
  <text x="196" y="97" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="22">Mini CLI Assistant - Unique Edition</text>

  <text x="92" y="156" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="25">Developer profile: Narendra</text>
  <text x="92" y="194" fill="#38bdf8" font-family="Consolas, Menlo, monospace" font-size="24">Type 'help' to see available commands.</text>

  <text x="92" y="252" fill="#22d3ee" font-family="Consolas, Menlo, monospace" font-size="23">You&gt; help</text>
  <text x="92" y="292" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="20">Available commands:</text>
  <text x="122" y="326" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="18">time, date, help, calc, joke, note, notes, history, insights</text>
  <text x="122" y="356" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="18">mode, challenge, alias, aliases, profile, exit</text>

  <text x="92" y="416" fill="#22d3ee" font-family="Consolas, Menlo, monospace" font-size="23">You&gt; mode mentor</text>
  <text x="92" y="452" fill="#a7f3d0" font-family="Consolas, Menlo, monospace" font-size="20">[Mentor Mode] Mode switched to mentor.</text>

  <text x="92" y="510" fill="#22d3ee" font-family="Consolas, Menlo, monospace" font-size="23">You&gt; alias add t=time</text>
  <text x="92" y="546" fill="#a7f3d0" font-family="Consolas, Menlo, monospace" font-size="20">[Mentor Mode] Alias saved: t -&gt; time</text>

  <text x="92" y="604" fill="#22d3ee" font-family="Consolas, Menlo, monospace" font-size="23">You&gt; t</text>
  <text x="92" y="640" fill="#a7f3d0" font-family="Consolas, Menlo, monospace" font-size="20">[Mentor Mode] Current time: 16:39:23</text>

  <text x="92" y="740" fill="#64748b" font-family="Consolas, Menlo, monospace" font-size="18">Live run screenshot generated from actual terminal output</text>
  <text x="92" y="780" fill="#f8fafc" font-family="Georgia, serif" font-size="28">Smart routing, personality modes, and custom alias support</text>
</svg>
